- name: Configure Proxmox
  hosts: proxmox
  pre_tasks:
    - name: Ensure enterprise repo file is not present
      ansible.builtin.file:
        path: /etc/apt/sources.list.d/pve-enterprise.sources
        state: absent

    - name: Check if ceph is set to enterprise repo
      ansible.builtin.slurp:
        src: /etc/apt/sources.list.d/ceph.sources
      register: ceph_sources

    - name: Replace ceph enterprise repo with no subcription repo
      when: "'enterprise' in (ceph_sources['content'] | b64decode)"
      block:
        - name: Delete ceph enterprise repo
          ansible.builtin.file:
            path: /etc/apt/sources.list.d/ceph.sources
            state: absent

        - name: Add ceph no subscription repo
          ansible.builtin.deb822_repository:
            name: proxmox
            types: deb
            uris: http://download.proxmox.com/debian/pve
            suites: '{{ ansible_distribution_release }}'
            components: pve-no-subscription

    - name: Add no subscription repo
      ansible.builtin.deb822_repository:
        name: ceph
        types: deb
        uris: http://download.proxmox.com/debian/ceph-tentacle
        suites: '{{ ansible_distribution_release }}'
        components: no-subscription


    - name: Update cache
      ansible.builtin.apt:
        update_cache: true

  roles:
    - tailscale
    - delete-ssh
    - update
    - setup-machine
