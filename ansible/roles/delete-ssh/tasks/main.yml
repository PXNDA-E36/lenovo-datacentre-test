- name: Grab Tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_json

- name: Check if Tailscale SSH is active
  ansible.builtin.shell: tailscale debug prefs | grep -q '"RunSSH":\s*true'
  register: tailscale_ssh_status

- name: Disable SSH if Tailscale is up
  when:
    - tailscale_status_json.rc == 0
    - (tailscale_status_json.stdout | from_json).BackendState | default('') == 'Running'
    - tailscale_ssh_status.rc == 0
  block:
    - name: Extract Tailscale hostname
      ansible.builtin.set_fact:
        tailscale_hostname: "{{ (tailscale_status_json.stdout | from_json).Self.HostName }}"

    - name: Update local inventory with Tailscale hostname
      ansible.builtin.lineinfile:
        path: '{{ inventory_file }}'
        regexp: '^(\s*){{ inventory_hostname | regex_escape }}\b.*'
        line: '\1{{ tailscale_hostname }}'
        backrefs: true
      delegate_to: localhost

    - name: Switch Ansible to Tailscale
      ansible.builtin.set_fact:
        ansible_host: "{{ tailscale_hostname }}"

    - name: Turn off SSH
      ansible.builtin.systemd_service:
        name: ssh
        enabled: false
        state: "stopped"

- name: Restart Ansible
  ansible.builtin.meta: "reset_connection"
